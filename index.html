<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hexapod — 웹 물리 시뮬</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; overflow: hidden;
    background: #0c1419; color: #dbe7ec;
    font: 13px/1.45 ui-sans-serif, system-ui, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  aside {
    width: 290px; flex: none; padding: 14px 14px 20px; overflow-y: auto;
    background: #121e25; border-right: 1px solid #22343f;
  }
  h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: .01em; }
  .sub { margin: 0 0 14px; font-size: 11px; color: #7e9aa8; }
  .row { display: grid; grid-template-columns: 1fr 96px 46px; gap: 8px; align-items: center; margin-bottom: 7px; }
  .row span { font-size: 11.5px; color: #a8c0cc; }
  .row em { color: #ff8a3d; font-style: normal; }
  .row b { font-variant-numeric: tabular-nums; font-weight: 500; font-size: 11.5px; color: #2ec4b6; text-align: right; }
  input[type=range] { width: 100%; accent-color: #ff8a3d; height: 18px; }
  button {
    width: 100%; margin-top: 12px; padding: 8px; cursor: pointer;
    background: #1d3038; color: #dbe7ec; border: 1px solid #2f4b58; border-radius: 5px; font: inherit;
  }
  button:hover { background: #26404b; }
  .note { margin-top: 14px; font-size: 10.5px; line-height: 1.6; color: #6d8896; }
  .note code { color: #93b3c1; }
  main { flex: 1; position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: absolute; left: 14px; bottom: 12px; padding: 6px 10px; border-radius: 5px;
    background: #0c1419cc; border: 1px solid #22343f; color: #9fbecb;
    font: 11.5px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums; pointer-events: none; white-space: pre;
  }
  #sticks {
    position: absolute; right: 16px; bottom: 14px; display: flex; gap: 14px;
  }
  .stick {
    position: relative; width: 104px; height: 104px; border-radius: 50%;
    background: radial-gradient(circle at 50% 42%, #1b2c35, #101a20 72%);
    border: 1px solid #2f4b58; touch-action: none; cursor: grab;
    box-shadow: inset 0 2px 10px #0007;
  }
  .stick:active { cursor: grabbing; }
  .stick::before {
    content: ''; position: absolute; inset: 50% 8px auto; height: 1px; background: #ffffff10;
  }
  .stick::after {
    content: ''; position: absolute; inset: 8px auto 8px 50%; width: 1px; background: #ffffff10;
  }
  .knob {
    position: absolute; left: 50%; top: 50%; width: 42px; height: 42px; margin: -21px 0 0 -21px;
    border-radius: 50%; background: linear-gradient(#3d6a7b, #24414d);
    border: 1px solid #4d7a8c; transition: background .12s;
  }
  .stick.active .knob { background: linear-gradient(#2ec4b6, #1b8a80); border-color: #48e3d4; }
  .cap {
    position: absolute; left: 0; right: 0; bottom: -17px; text-align: center;
    font: 10px ui-monospace, Consolas, monospace; letter-spacing: .09em; color: #6d8896;
  }
  .legend { position: absolute; left: 14px; top: 12px; font-size: 11px; color: #7e9aa8; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 4px 0 10px; }
  .legend i:first-child { margin-left: 0; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.20.0/dist/rapier.mjs"
  }
}
</script>
</head>
<body>
<aside>
  <h1>Hexapod gait control</h1>
  <p class="sub">three.js + Rapier · 브라우저에서만 도는 물리</p>
  <div id="params"></div>
  <button id="reset">리셋 (↻ 표시 항목은 자동 리셋)</button>
  <p class="note">
    <b style="color:#a8c0cc">WASD</b> 이동 · <b style="color:#a8c0cc">IJKL</b> 선회/높이 (스틱을 끌어도 된다)<br>
    슬라이더의 보폭·높이는 스틱을 끝까지 밀었을 때의 값이다.<br><br>
    발 궤적은 <code>gait.js</code> 의 <code>shape()</code> 하나에서 나온다.<br>
    기구학은 <code>ik.js</code>, 조립·서보는 <code>robot.js</code>.<br>
    검증: <code>node test.mjs</code>
  </p>
</aside>
<main>
  <canvas id="c"></canvas>
  <div class="legend">tripod <i style="background:#2ec4b6"></i>A <i style="background:#ff8a3d"></i>B <i style="background:#9bff6a"></i>앞</div>
  <div id="hud">…</div>
  <div id="sticks"><div id="stickL"></div><div id="stickR"></div></div>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
